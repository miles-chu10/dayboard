name: Signed macOS release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'miles-chu10/dayboard'
    runs-on: macos-15
    timeout-minutes: 60
    environment: macos-release
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      DAYBOARD_LICENSE_API_URL: ${{ vars.DAYBOARD_LICENSE_API_URL }}
      DAYBOARD_STRIPE_PRODUCT_ID: ${{ vars.DAYBOARD_STRIPE_PRODUCT_ID }}
      DAYBOARD_LICENSE_ENVIRONMENT: live
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            billing/package-lock.json
      - name: Validate tag, version and main ancestry
        id: plan
        run: node scripts/macos-release.mjs plan
      - name: Install locked dependencies
        run: |
          npm ci --include=dev
          npm --prefix billing ci --include=dev
      - name: Test before loading release credentials
        run: |
          npm run format:check
          npm run typecheck
          npm run lint
          npm test
          npm run test:billing
          npm run test:e2e
      - name: Build, sign and notarize
        env:
          DAYBOARD_RELEASE: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          DAYBOARD_GOOGLE_OAUTH_JSON: ${{ secrets.DAYBOARD_GOOGLE_OAUTH_JSON }}
        run: |
          node scripts/macos-release.mjs credentials
          export CSC_LINK="$RUNNER_TEMP/dayboard-release-credentials/certificate.p12"
          export APPLE_API_KEY="$RUNNER_TEMP/dayboard-release-credentials/notary.p8"
          export DAYBOARD_GOOGLE_OAUTH_FILE="$RUNNER_TEMP/dayboard-release-credentials/google-oauth.json"
          npm run build
          npx --no-install electron-builder --mac --arm64 --publish never --config.forceCodeSigning=true --config.mac.notarize=true --config.dmg.sign=true
      - name: Remove temporary signing inputs
        if: always()
        run: node scripts/macos-release.mjs cleanup
      - name: Verify signed app, DMG and ZIP
        run: node scripts/macos-release.mjs verify
      - name: Smoke-test the signed package with fictional data
        env:
          DAYBOARD_E2E_EXECUTABLE: ${{ github.workspace }}/release/mac-arm64/DayBoard.app/Contents/MacOS/DayBoard
        run: npx --no-install playwright test e2e/smoke.spec.ts e2e/behavior.spec.ts
      - name: Prepare checksummed downloads
        run: node scripts/macos-release.mjs stage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-macos-${{ steps.plan.outputs.tag }}
          path: ${{ runner.temp }}/dayboard-release-assets/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7

  publish:
    needs: build
    if: github.repository == 'miles-chu10/dayboard'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-macos-${{ needs.build.outputs.tag }}
          path: release-assets
      - name: Publish only the verified downloads
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
        with:
          script: |
            const { publishRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/macos-release.mjs`);
            const result = await publishRelease({
              github, repository: `${context.repo.owner}/${context.repo.repo}`,
              tag: process.env.RELEASE_TAG, sha: process.env.RELEASE_SHA,
              directory: `${process.env.GITHUB_WORKSPACE}/release-assets`,
            });
            await core.summary.addHeading('Signed macOS release').addLink(result.url, result.url).write();
