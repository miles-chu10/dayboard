name: Codex review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      vars.CODEX_REVIEW_ENABLED == 'true' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.review.outputs.final-message }}
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Fetch both commits, then restore the base tree before loading any prompt
      # or instructions. PR files are inspected with git diff/show, never run.
      - name: Use the trusted base tree
        run: git checkout --detach "$PR_BASE_SHA"
      - name: Review changes
        id: review
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review.md
          sandbox: read-only
          safety-strategy: drop-sudo
          codex-home: ${{ runner.temp }}/codex-review
          codex-args: '["--ephemeral"]'

  post-review:
    needs: review
    if: needs.review.outputs.final_message != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      # This fresh job has no OpenAI key and never checks out or executes PR code.
      - uses: actions/github-script@v8
        env:
          REVIEW_TEXT: ${{ needs.review.outputs.final_message }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number });
            if (pull.state !== "open" || pull.head.sha !== process.env.REVIEWED_SHA) return;
            const marker = "<!-- dayboard-codex-review -->";
            const body = `${marker}\nCodex review of ${process.env.REVIEWED_SHA.slice(0, 7)}\n\n${process.env.REVIEW_TEXT.slice(0, 60000)}`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pull_number });
            const previous = comments.find(comment => comment.user?.login === "github-actions[bot]" && comment.body?.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pull_number, body });
            }
