name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Offline tests (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      # Offline fixtures replace Electron and providers. The native Swift fixture runs
      # on macOS only; this job never needs account credentials or a local app installation.
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
